name: Gitleaks secret scan

# Hardened per the Taryan CI pattern (aquabubble/Taryan ci.yml):
# - gitleaks download is checksum-verified; version and sha256 must be
#   overridden TOGETHER (the default sha is for linux_x64 of the default
#   version, verified independently 2026-08-21).
# - "Prove the scanner can detect" runs before any scan: a .gitleaks.toml that
#   claims to extend the defaults but has no [extend] block matches nothing
#   and still exits 0 — this happened for real, with a live credential in the
#   tree ("no leaks found"). No clean result is believed until the config has
#   detected a planted canary.
# - .gitleaksignore is rejected: it is a second policy input that suppresses
#   findings independently of .gitleaks.toml.
# - Tree-local env files are rejected: catches `git add -f` past .gitignore.
# - Third-party actions are pinned by full commit SHA; tags are mutable.

on:
  workflow_call:
    inputs:
      gitleaks-version:
        type: string
        default: "8.30.1"
      gitleaks-sha256:
        description: sha256 of gitleaks_<version>_linux_x64.tar.gz — override together with gitleaks-version
        type: string
        default: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
      strict:
        description: also ignore inline `gitleaks:allow` comments (repos that forbid inline suppression)
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    # bash adds -o pipefail; a failure on the left of a pipe must not vanish.
    shell: bash

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install gitleaks (checksum-verified)
        env:
          VERSION: ${{ inputs.gitleaks-version }}
          SHA256: ${{ inputs.gitleaks-sha256 }}
        run: |
          curl -fsSLo gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "${SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          rm -f gitleaks gitleaks.tar.gz
          gitleaks version

      # If the scanner cannot detect, every later "clean" result is
      # meaningless. Plant a synthetic token OUTSIDE the workspace and require
      # the repo's effective config to flag it — and specifically require the
      # DEFAULT github-pat rule to be the one that fires, which proves the
      # config inherits the standard ruleset (a custom-only config that still
      # matches something would otherwise false-green this check).
      - name: Prove the scanner can detect
        run: |
          canary_dir=$(mktemp -d)
          # 36 chars after ghp_ — the github-pat rule's exact requirement.
          printf 'token = "ghp_9fK2xQ7mWpL4tR8vN3jY6bC1dH5gZ0aEsUwX"\n' > "$canary_dir/canary.txt"
          report=$(mktemp)
          cfg=()
          if [ -f .gitleaks.toml ]; then
            cfg=(--config .gitleaks.toml)
          fi
          set +e
          gitleaks dir "$canary_dir" "${cfg[@]}" --no-banner --exit-code 9 \
            --report-format json --report-path "$report" >/dev/null 2>&1
          status=$?
          set -e
          rm -rf "$canary_dir"
          if [ "$status" -ne 9 ]; then
            rm -f "$report"
            echo "::error::scanner did NOT detect the canary (exit $status) — the gitleaks config is inert or broken; no scan result from it can be trusted"
            exit 1
          fi
          if ! jq -e 'any(.[]; .RuleID == "github-pat")' "$report" >/dev/null; then
            echo "::error::canary was flagged, but NOT by the default github-pat rule — the config does not inherit the standard ruleset (missing [extend]?)"
            jq -r '.[].RuleID' "$report" | sed 's/^/  fired instead: /'
            rm -f "$report"
            exit 1
          fi
          rm -f "$report"
          echo "canary detected by the default github-pat rule — standard ruleset is active"

      - name: Reject fingerprint suppression
        run: |
          if [ -e .gitleaksignore ]; then
            echo "::error::.gitleaksignore suppresses findings independently of .gitleaks.toml — move policy into .gitleaks.toml"
            exit 1
          fi

      # Catches a tree-local env file added with `git add -f`, which
      # .gitignore alone does not stop. awk returns 0 on no-match, so under
      # pipefail a git ls-files failure still fails the step (fail closed) —
      # a trailing `|| true` would have swallowed it.
      - name: Reject tree-local env files
        run: |
          found=$(git ls-files | awk '/(^|\/)\.env($|\.)/ && !/\.env\.example$/')
          if [ -n "$found" ]; then
            echo "::error::tree-local env file committed:"
            echo "$found"
            exit 1
          fi

      # On pull_request events, scan only the PR's own commits: the checkout
      # is the synthetic merge ref, and gitleaks flags secrets in the merge
      # commit's per-parent diff even when a secret was REMOVED on the base
      # branch (the deletion hunks resurface it under the unstable merge-commit
      # SHA, which .gitleaksignore fingerprints can never pin). Push events
      # keep the full-history scan.
      - name: Scan git history
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          STRICT: ${{ inputs.strict }}
        run: |
          flags=(--redact --verbose --no-banner --exit-code 1)
          if [ "$STRICT" = "true" ]; then
            flags+=(--ignore-gitleaks-allow)
          fi
          if [ "$EVENT" = "pull_request" ]; then
            gitleaks git . "${flags[@]}" --log-opts "--no-merges ${BASE_SHA}..HEAD"
          else
            gitleaks git . "${flags[@]}"
          fi
