name: Gitleaks secret scan
on:
  workflow_call:
    inputs:
      gitleaks-version:
        type: string
        default: "8.24.3"

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks
        env:
          VERSION: ${{ inputs.gitleaks-version }}
        run: |
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -C /tmp -xz gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
      # On pull_request events, scan only the PR's own commits: the checkout
      # is the synthetic merge ref, and gitleaks flags secrets in the merge
      # commit's per-parent diff even when a secret was REMOVED on the base
      # branch (the deletion hunks resurface it under the unstable merge-commit
      # SHA, which .gitleaksignore fingerprints can never pin). Push events
      # keep the full-history scan.
      - name: Scan git history
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            gitleaks detect --redact --verbose --source . --exit-code 1 \
              --log-opts "--no-merges ${BASE_SHA}..HEAD"
          else
            gitleaks detect --redact --verbose --source . --exit-code 1
          fi
