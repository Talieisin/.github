name: CI pnpm

# Actions are pinned by full commit SHA; tags are mutable.
#
# Runtime resolution, in order:
# 1. If the repo has a mise.toml, mise IS the single source of truth — node
#    and pnpm come from it (mise-action), and the version inputs are ignored.
#    The repo's mise.toml must therefore pin BOTH node and pnpm.
# 2. Otherwise the version inputs apply (pnpm/action-setup + setup-node).

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: "24"
      pnpm-version:
        type: string
        # Pass "" to defer to package.json "packageManager". pnpm/action-setup
        # errors when this input is set and disagrees with that field, so a repo
        # pinning an exact pnpm should either pass "" (single source of truth)
        # or pass the identical exact version.
        default: "10"

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Detect mise.toml
        id: mise
        run: echo "present=$([ -f mise.toml ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      # ── mise path: local dev and CI share one pin ──────────────────────────
      - if: steps.mise.outputs.present == 'true'
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          install: true
          cache: true

      - name: Confirm mise supplies the toolchain
        if: steps.mise.outputs.present == 'true'
        run: |
          command -v node >/dev/null || { echo "::error::mise.toml must pin node"; exit 1; }
          command -v pnpm >/dev/null || { echo "::error::mise.toml must pin pnpm (CI takes versions from mise.toml, not workflow inputs)"; exit 1; }
          echo "node $(node --version) / pnpm $(pnpm --version) via:"
          mise ls --current

      # ── fallback path: version inputs ──────────────────────────────────────
      - if: steps.mise.outputs.present == 'false'
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: ${{ inputs.pnpm-version }}
      # Must stay after pnpm/action-setup: setup-node's pnpm cache resolution
      # shells out to `pnpm store path`, so pnpm has to be on PATH already.
      - if: steps.mise.outputs.present == 'false'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Detect scripts
        id: scripts
        run: |
          has_typecheck=$(jq -r 'has("scripts") and (.scripts | has("typecheck"))' package.json)
          has_build=$(jq -r 'has("scripts") and (.scripts | has("build"))' package.json)
          has_test=$(jq -r 'has("scripts") and (.scripts | has("test"))' package.json)
          echo "has_typecheck=$has_typecheck" >> "$GITHUB_OUTPUT"
          echo "has_build=$has_build" >> "$GITHUB_OUTPUT"
          echo "has_test=$has_test" >> "$GITHUB_OUTPUT"
      # Runs before build so a project that only wants type validation does not
      # need a no-op `build` script purely to get checked.
      - name: Typecheck
        if: steps.scripts.outputs.has_typecheck == 'true'
        run: pnpm run typecheck
      - name: Build
        if: steps.scripts.outputs.has_build == 'true'
        run: pnpm run build
      - name: Test
        if: steps.scripts.outputs.has_test == 'true'
        run: pnpm test
