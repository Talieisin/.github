name: CI pnpm

# Actions are pinned by full commit SHA; tags are mutable.
#
# Runtime resolution is EXPLICIT, never inferred from file presence (a repo
# can carry a mise.toml for local dev while its CI contract stays on the
# version inputs — caersid does exactly this):
# - toolchain-source: "inputs" (default) → pnpm/action-setup + setup-node
#   from the version inputs, exactly as before.
# - toolchain-source: "mise" → the repo's mise.toml is the single source of
#   truth for BOTH node and pnpm; the version inputs are ignored and the
#   workflow fails if mise does not supply both tools.

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: "24"
      pnpm-version:
        type: string
        # Pass "" to defer to package.json "packageManager". pnpm/action-setup
        # errors when this input is set and disagrees with that field, so a repo
        # pinning an exact pnpm should either pass "" (single source of truth)
        # or pass the identical exact version.
        default: "10"
      toolchain-source:
        description: '"inputs" (default) or "mise" — opt in to mise.toml as the single runtime source'
        type: string
        default: "inputs"

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate toolchain-source
        env:
          SOURCE: ${{ inputs.toolchain-source }}
        run: |
          case "$SOURCE" in
            inputs|mise) ;;
            *) echo "::error::toolchain-source must be 'inputs' or 'mise', got '$SOURCE'"; exit 1 ;;
          esac
          if [ "$SOURCE" = "mise" ] && [ ! -f mise.toml ]; then
            echo "::error::toolchain-source is 'mise' but the repo has no mise.toml"
            exit 1
          fi

      # ── mise path: local dev and CI share one pin ──────────────────────────
      - if: inputs.toolchain-source == 'mise'
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          # Must move together: sha256 is the hash of the EXTRACTED mise
          # binary (official SHASUMS entry for mise-v<version>-linux-x64,
          # no extension) — mise-action verifies the binary it installs,
          # NOT the tarball it downloads. linux-x64 only; this job hardcodes
          # ubuntu-latest, so no per-OS hash map is needed.
          version: 2026.8.10
          sha256: 1f5e8795d24073904ef20ba70c1250ad6389d8c5672226d152e0ed24909ba72f
          install: true
          cache: true

      # `mise which` fails unless mise's CONFIG supplies the tool (`command -v`
      # would accept the runner's preinstalled ambient Node) — and the PATH
      # comparison then proves the binary later steps actually execute IS the
      # mise-provided one, not an ambient install shadowing it. realpath
      # normalises symlinks; mise-action adds real tool paths (not shims).
      - name: Confirm mise supplies the toolchain
        if: inputs.toolchain-source == 'mise'
        run: |
          for tool in node pnpm; do
            from_mise=$(mise which "$tool") || { echo "::error::mise.toml must pin $tool (toolchain-source: mise ignores the version inputs)"; exit 1; }
            from_path=$(command -v "$tool") || { echo "::error::$tool is not on PATH despite mise config"; exit 1; }
            if [ "$(realpath "$from_path")" != "$(realpath "$from_mise")" ]; then
              echo "::error::$tool on PATH ($from_path) is not the mise-provided binary ($from_mise) — ambient runtime is shadowing mise"
              exit 1
            fi
          done
          echo "node $(node --version) / pnpm $(pnpm --version) via mise:"
          mise ls --current

      # mise-action caches only mise's own data dir, not the pnpm store —
      # without this step every mise-path run redownloads all dependencies.
      - name: Resolve pnpm store path
        if: inputs.toolchain-source == 'mise'
        id: pnpm-store
        run: echo "dir=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - if: inputs.toolchain-source == 'mise'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.dir }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      # ── inputs path (default): exactly the pre-existing behaviour ──────────
      - if: inputs.toolchain-source != 'mise'
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: ${{ inputs.pnpm-version }}
      # Must stay after pnpm/action-setup: setup-node's pnpm cache resolution
      # shells out to `pnpm store path`, so pnpm has to be on PATH already.
      - if: inputs.toolchain-source != 'mise'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Detect scripts
        id: scripts
        run: |
          has_typecheck=$(jq -r 'has("scripts") and (.scripts | has("typecheck"))' package.json)
          has_build=$(jq -r 'has("scripts") and (.scripts | has("build"))' package.json)
          has_test=$(jq -r 'has("scripts") and (.scripts | has("test"))' package.json)
          echo "has_typecheck=$has_typecheck" >> "$GITHUB_OUTPUT"
          echo "has_build=$has_build" >> "$GITHUB_OUTPUT"
          echo "has_test=$has_test" >> "$GITHUB_OUTPUT"
      # Runs before build so a project that only wants type validation does not
      # need a no-op `build` script purely to get checked.
      - name: Typecheck
        if: steps.scripts.outputs.has_typecheck == 'true'
        run: pnpm run typecheck
      - name: Build
        if: steps.scripts.outputs.has_build == 'true'
        run: pnpm run build
      - name: Test
        if: steps.scripts.outputs.has_test == 'true'
        run: pnpm test
