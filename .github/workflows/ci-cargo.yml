name: CI cargo
on:
  workflow_call:
    inputs:
      toolchain:
        type: string
        default: "stable"
      runner:
        description: 'runs-on label for the test job, e.g. a Blacksmith label; defaults to ubuntu-latest'
        type: string
        default: "ubuntu-latest"

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ inputs.toolchain }}
      - uses: Swatinem/rust-cache@v2
      - name: Check
        run: cargo check --all-targets
      - name: Test
        run: cargo test --all-targets
