name: CI npm
on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: "24"
      install-command:
        type: string
        default: "npm ci"
      build-command:
        type: string
        default: "npm run build --if-present"
      test-command:
        type: string
        default: "npm test --if-present"
      runner:
        description: 'runs-on label for the test job, e.g. blacksmith-4vcpu-ubuntu-2404; defaults to ubuntu-latest'
        type: string
        default: "ubuntu-latest"

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: 'npm'
      - name: Install
        run: ${{ inputs.install-command }}
      - name: Build
        run: ${{ inputs.build-command }}
      - name: Test
        run: ${{ inputs.test-command }}
