name: CI terraform
on:
  workflow_call:
    inputs:
      directories:
        type: string
        description: 'JSON array of terraform directories'
        default: '["."]'
      terraform-version:
        type: string
        default: "latest"
      runner:
        description: 'runs-on label for the test job, e.g. blacksmith-4vcpu-ubuntu-2404; defaults to ubuntu-latest'
        type: string
        default: "ubuntu-latest"

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ inputs.runner }}
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJSON(inputs.directories) }}
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ inputs.terraform-version }}
      - name: Format check
        run: terraform fmt -check -recursive
        working-directory: ${{ matrix.dir }}
        continue-on-error: true
      - name: Init
        run: terraform init -backend=false
        working-directory: ${{ matrix.dir }}
      - name: Validate
        run: terraform validate
        working-directory: ${{ matrix.dir }}
