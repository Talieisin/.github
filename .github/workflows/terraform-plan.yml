name: Terraform plan (pinned)
# Terraform plan on pull requests for Talieisin/caersid (caersid #602), as a
# reusable workflow that caersid calls at a full commit SHA. Azure trusts the
# plan identity (id-caersid-plan-prod) only for a token whose subject names
# THIS file at THAT SHA:
#
#   repo:Talieisin/caersid:pull_request:job_workflow_ref:Talieisin/.github/.github/workflows/terraform-plan.yml@<40-hex SHA>
#
# (caersid's OIDC subject template: include_claim_keys repo, context,
# job_workflow_ref.) A pull request that edits caersid's caller can change the
# inputs or the pin, but not what runs under that subject: another SHA, a
# branch, a tag or an edited copy presents a different subject, which no
# credential trusts. Every gate is therefore in this file, never in the caller.
#
# PIN EXCEPTION (George, 2026-11-18): caersid pins this workflow by exact SHA,
# and Azure trusts exactly that SHA. Each bump: George, and only George, from
# his own terminal, adds the federated credential for the new SHA BEFORE the
# bump merges, and deletes the old one after. No agent or workflow creates
# these credentials. No ref, tag or wildcard subject: this repository is
# public, so a fork's commit is addressable through it. Changing this file
# changes nothing in caersid until the pin moves.
#
# Jobs:
#   gate    no checkout, no credentials. Plans only George's own work:
#           - a pull_request event on Talieisin/caersid, first run attempt;
#           - the pull request opened by, and this run started by, George's
#             account, matched by numeric id (PLAN_PERSON_ID);
#           - same repository (no fork), based on main, and not behind main on
#             infrastructure/terraform/ (otherwise: rebase);
#           - every commit a signed commit whose author and committer are
#             George's account (by numeric id), not web-flow;
#           - every push to the branch, back to its creation, by George
#             (activity API, a strict chain: anything unprovable refuses).
#   prepare no id-token permission and no action: only this file's code. Fetches
#           the pushed head and main by commit id (never a merge), builds
#           tfguard (an HCL parser on hashicorp/hcl/v2, source below and in
#           tools/tfguard) with a checksummed Go, and hands the plan job one
#           verdict per tier. tfguard refuses odd names, links, test files,
#           nested or JSON configuration and modules; any terraform, provider
#           or remote-state block unlike main's, and anything they reference;
#           changed lock, variable or (when configuration reads files)
#           template files; and in every TAINTED block (changed by the pull
#           request, or depending on one that is): file-reading and
#           provider-defined functions, non-literal count or for_each, risky
#           or new data source types (new resource types are allowed:
#           Terraform reads nothing of an object it creates), import, moved,
#           removed, check, ephemeral and unknown blocks, and pre- and
#           postconditions.
#   plan    the only job with id-token: write, and only on run attempt 1; no
#           action, only this file's code. Fetches the same two commits by
#           id, installs a checksummed Terraform, and runs init (main's lock,
#           read-only) in a step that execs without ACTIONS_ID_TOKEN_REQUEST_*.
#           Per tier: rechecks that main has not moved, mints one ID token
#           into a 0600 file (audience, and a subject naming this file at its
#           own commit id, checked), execs into the plan without the request
#           variables or a GitHub token, gets Entra tokens with the file,
#           checks the identity, fetches the state, runs terraform plan in a
#           clean environment (token file only; no CLI or MSI sign-in), and
#           deletes the file and the state copy. Names-only summary.
#   comment posts the summaries or the reasons on the pull request, unless
#           main moved during the run. No checkout; it runs nothing from the
#           repository.
#
# Residual George accepted (caersid G3, 2026-11-18, and again for #44 on the
# same day): the pull request's own Terraform is evaluated while the token
# file exists, and code George pushes can make the plan's outcome depend on
# a value. Known to remain:
#   - Terraform can read the token file (a replay is bounded by the token's
#     lifetime and the plan identity) and the state copy;
#   - resource types of any provider in main's lock, and data source types
#     main already uses, may send requests to a host their arguments name;
#   - a validation block of a variable the pull request changes can make
#     the plan fail on a value;
#   - plan success or failure, the failure class, which resources change,
#     how many rows (instances) there are and which outputs change can each
#     carry a bit from a value.
# What any channel can reach is what the plan identity can: both state files,
# the Tailscale storage key and log queries.
# Caller contract (caersid's .github/workflows/terraform-plan.yml):
#   on: pull_request (opened, synchronize, reopened), never pull_request_target;
#   permissions: contents read, pull-requests write, id-token write;
#   jobs.<id>.uses: Talieisin/.github/.github/workflows/terraform-plan.yml@<SHA>
#   with: azure-client-id, azure-tenant-id (IDs, not secrets), and
#   terraform-version only when it differs from the default; no secrets.
#   Empty client or tenant ID: the plan job warns and plans nothing. Any value
#   but the two fixed in the plan job's env fails it: the caller can switch
#   planning on, never choose the identity.
#
# Inputs reach scripts only through env, never by ${{ }} inside a script.

on:
  workflow_call:
    inputs:
      azure-client-id:
        description: Client ID of id-caersid-plan-prod (empty = not configured, nothing planned; any other value fails)
        type: string
        default: ""
      azure-tenant-id:
        description: Its tenant ID (empty = not configured, nothing planned; any other value fails)
        type: string
        default: ""
      terraform-version:
        description: Terraform release to install; follows George's Terraform. Only a release whose checksum is recorded in this file installs.
        type: string
        default: "1.14.9"

defaults:
  run:
    shell: bash

env:
  # george-elphick-talieisin (numeric id: a login can be renamed and reused).
  PLAN_PERSON_ID: "146720324"
  PLAN_REPO: Talieisin/caersid

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      result: ${{ steps.check.outputs.result }}
      head-sha: ${{ steps.check.outputs.head-sha }}
      main-sha: ${{ steps.check.outputs.main-sha }}
    steps:
      # result: ok | rerun | person | base | behind | commits | pushes. Any API
      # error, an
      # unexpected answer or a head that moved fails this job instead, and plan
      # does not start either way.
      - name: Decide whether this pull request may be planned
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          ACTOR: ${{ github.actor }}
          ACTOR_ID: ${{ github.actor_id }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          SENDER_ID: ${{ github.event.sender.id }}
          PR: ${{ github.event.pull_request.number }}
          PR_USER_ID: ${{ github.event.pull_request.user.id }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          fail() { echo "::error title=Plan gate::$1"; exit 1; }
          refuse() { echo "::warning title=Nothing planned::$2"; echo "result=$1" >> "$GITHUB_OUTPUT"; exit 0; }
          hex40='^[0-9a-f]{40}$'

          [ "$REPO" = "$PLAN_REPO" ] || fail "this workflow plans $PLAN_REPO only, not $REPO"
          [ "$EVENT" = pull_request ] || fail "event $EVENT: only pull_request is planned"
          case $ACTION in opened | synchronize | reopened) ;; *) fail "pull_request action $ACTION is not planned" ;; esac
          [[ $HEAD_SHA =~ $hex40 ]] || fail "the event has no head commit"
          [[ $PR =~ ^[1-9][0-9]*$ ]] || fail "the event has no pull request number"

          # A partial re-run would reuse this job's outputs; a full re-run is
          # started by whoever re-runs it. Neither is planned: push again.
          [ "$RUN_ATTEMPT" = 1 ] || refuse rerun "run attempt $RUN_ATTEMPT: re-runs are never planned. Push again to plan."

          # George's own pull request, and George's own push or reopen.
          if [ "$PR_USER_ID" != "$PLAN_PERSON_ID" ] || [ "$ACTOR_ID" != "$PLAN_PERSON_ID" ] \
             || [ "$SENDER_ID" != "$PLAN_PERSON_ID" ] || [ "$TRIGGERING_ACTOR" != "$ACTOR" ]; then
            refuse person "only George's own pull requests and pushes are planned in CI. George plans this one locally."
          fi

          pull=$(gh api "repos/$REPO/pulls/$PR") || fail "the pull request could not be read"
          jq -e --arg h "$HEAD_SHA" --arg r "$REPO" --argjson p "$PLAN_PERSON_ID" '
            .state == "open" and .head.sha == $h and .head.repo.full_name == $r
            and .base.repo.full_name == $r and .user.id == $p' <<<"$pull" >/dev/null 2>&1 \
            || fail "the pull request is not open, is from a fork, has another author, or its head moved since this run started"
          [ "$(jq -r '.base.ref' <<<"$pull")" = main ] \
            || refuse base "this pull request is not based on main. Retarget it to main, then push again."
          count=$(jq -er '.commits | numbers' <<<"$pull" 2>/dev/null) || fail "the pull request has no commit count"

          # The pushed head is what is planned (George, 2026-11-18), never a
          # merge. If main has Terraform changes the head lacks, the plan would
          # undo them: refuse until George rebases (HCP and Atlantis handle a
          # stale branch the same way). main's commit is recorded for the
          # rules' baseline.
          main_sha=$(gh api "repos/$REPO/commits/main" --jq '.sha') || fail "main could not be read"
          [[ $main_sha =~ $hex40 ]] || fail "main has no commit id"
          cmp=$(gh api "repos/$REPO/compare/$HEAD_SHA...$main_sha") || fail "the head could not be compared with main"
          ahead=$(jq -er '.ahead_by | numbers' <<<"$cmp" 2>/dev/null) || fail "the comparison with main has no count"
          if [ "$ahead" -gt 0 ]; then
            nfiles=$(jq -er '.files | length' <<<"$cmp" 2>/dev/null) || fail "the comparison with main has no file list"
            [ "$nfiles" -lt 300 ] || refuse behind "main has more changes since this branch than the API lists, so it cannot tell whether they touch Terraform. Rebase onto main and push again."
            # A file main moved counts by its old name too. jq: 0 a match,
            # 1 none, anything else an error (fail).
            rc=0
            jq -e 'any(.files[]; ((.filename // "") | startswith("infrastructure/terraform/")) or ((.previous_filename // "") | startswith("infrastructure/terraform/")))' <<<"$cmp" > /dev/null 2>&1 || rc=$?
            case $rc in
              0) refuse behind "main has Terraform changes this branch does not have. Rebase it onto main locally and push again." ;;
              1) ;;
              *) fail "the comparison with main could not be read" ;;
            esac
          fi

          # Every commit a signed commit of George's (caersid G1, G2, bound to the
          # one person this workflow plans for): author and committer linked to
          # his account by numeric id, committer not web-flow, signature
          # verified.
          [ "$count" -le 250 ] || refuse commits "the pull request has $count commits; the API lists at most 250. George plans it locally."
          raw=$(gh api --paginate "repos/$REPO/pulls/$PR/commits?per_page=100") || fail "the commits could not be listed"
          commits=$(jq -esc 'add // [] | if type == "array" then . else error("not a list") end' <<<"$raw" 2>/dev/null) || fail "the commit list is not one this step reads"
          [ "$(jq -r 'length' <<<"$commits")" = "$count" ] || fail "the API did not list all $count commits"
          jq -e --arg h "$HEAD_SHA" 'any(.[]; .sha == $h)' <<<"$commits" >/dev/null 2>&1 || fail "the head is not among the listed commits"
          others=$(jq -ec --argjson p "$PLAN_PERSON_ID" '[ .[] | select((.author | type) != "object" or .author.type != "User" or .author.id != $p or (.committer | type) != "object" or .committer.type != "User" or .committer.id != $p or .committer.login == "web-flow" or .commit.verification.verified != true) ]' <<<"$commits" 2>/dev/null) || fail "the commits could not be classified"
          n=$(jq -r 'length' <<<"$others")
          if [ "$n" -ne 0 ]; then
            jq -r '.[] | "not a signed commit of George'"'"'s: \(.sha[0:7]) author \(.author.login // "(not linked)"), committer \(.committer.login // "(not linked)"), verified \(.commit.verification.verified)"' <<<"$others"
            refuse commits "$n of $count commits are not signed commits of George's. George plans this pull request locally, or rebases it and pushes signed commits."
          fi

          # Every push to the head branch, newest first, as one chain back to
          # its creation: the newest event's after is the head; each event's
          # before is the next older event's after; the oldest is the branch's
          # creation from nothing; every actor is George's account (a User, by
          # numeric id); only pushes, force-pushes and the creation. Pagination
          # must complete. Anything else, or anything missing, refuses.
          raw=$(gh api --paginate -X GET "repos/$REPO/activity" -f ref="refs/heads/$HEAD_REF" -f direction=desc -f per_page=100) \
            || fail "the branch's push history could not be read"
          events=$(jq -esc 'add // [] | if type == "array" then . else error("not a list") end' <<<"$raw" 2>/dev/null) \
            || fail "the branch's push history is not one this step reads"
          verdict=$(jq -r --arg head "$HEAD_SHA" --arg ref "refs/heads/$HEAD_REF" --argjson pid "$PLAN_PERSON_ID" '
            def zero: "0000000000000000000000000000000000000000";
            def sha: type == "string" and test("^[0-9a-f]{40}$");
            . as $ev
            | if ($ev | length) == 0 then "no push history for the branch"
              elif $ev[0].after != $head then "the newest push is not the pull request head"
              else
                reduce range(0; $ev | length) as $i ({done: false, bad: null, n: 0};
                  if .done or .bad != null then . else
                    $ev[$i] as $e
                    | if ($e | type) != "object" then .bad = "an event that is not an object"
                      elif $e.ref != $ref then .bad = "an event for another ref"
                      elif ($e.actor | type) != "object" or $e.actor.type != "User" or $e.actor.id != $pid
                        then .bad = "a push by \($e.actor.login // "an unknown actor") (\($e.actor.type // "no type")), not George"
                      elif ($e.activity_type | IN("push", "force_push", "branch_creation") | not)
                        then .bad = "a \($e.activity_type // "untyped") event in the chain"
                      elif ($e.after | sha | not) or ($e.before | sha | not) then .bad = "an event without commit ids"
                      elif $i > 0 and $ev[$i - 1].before != $e.after then .bad = "a gap in the push chain"
                      elif $i > 0 and (($ev[$i - 1].timestamp // "") < ($e.timestamp // "")) then .bad = "pushes out of order"
                      elif $e.activity_type == "branch_creation"
                        then (if $e.before == zero then .done = true | .n += 1 else .bad = "a branch creation from a commit" end)
                      else .n += 1 end
                  end)
                | if .bad != null then .bad
                  elif .done | not then "the chain does not reach the branch creation"
                  else "ok \(.n)" end
              end' <<<"$events" 2>/dev/null) || fail "the push history could not be checked"
          case $verdict in
            "ok "*) echo "ok: ${verdict#ok } pushes, all by George, from the branch creation to the head" ;;
            *) refuse pushes "the branch's push history does not prove George pushed everything: $verdict. George plans this pull request locally." ;;
          esac

          # Nothing moved while the above was read.
          again=$(gh api "repos/$REPO/pulls/$PR") || fail "the pull request could not be read again"
          jq -e --arg h "$HEAD_SHA" --argjson c "$count" '.head.sha == $h and .base.ref == "main" and .commits == $c' <<<"$again" >/dev/null 2>&1 \
            || fail "the pull request's head, base or commits changed during the checks; the next run checks it"

          echo "ok: every check passed"
          {
            echo "result=ok"
            echo "head-sha=$HEAD_SHA"
            echo "main-sha=$main_sha"
          } >> "$GITHUB_OUTPUT"

  # The rules, in a job that holds no id-token permission and runs no action:
  # every step is this file's own code. It fetches the pushed head and main
  # by commit id, builds tfguard (an HCL parser) with a checksummed Go, and
  # hands the plan job one verdict per tier.
  prepare:
    needs: gate
    if: >-
      github.event_name == 'pull_request' &&
      github.repository == 'Talieisin/caersid' &&
      github.run_attempt == '1' &&
      needs.gate.outputs.result == 'ok'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      state: ${{ steps.decide.outputs.state }}
      platform: ${{ steps.tiers.outputs.platform }}
      compute: ${{ steps.tiers.outputs.compute }}
      identity: ${{ steps.tiers.outputs.identity }}
      harness: ${{ steps.tiers.outputs.harness }}
      platform-state: ${{ steps.rules.outputs.platform-state }}
      compute-state: ${{ steps.rules.outputs.compute-state }}
      platform-note: ${{ steps.rules.outputs.platform-note }}
      compute-note: ${{ steps.rules.outputs.compute-note }}
      ready: ${{ steps.rules.outputs.ready }}
    env:
      REPO: ${{ github.repository }}
      HEAD_SHA: ${{ needs.gate.outputs.head-sha }}
      MAIN_SHA: ${{ needs.gate.outputs.main-sha }}
      PLAN_CLIENT_ID: f021a221-0d35-4931-bf82-06144ff184a2
      PLAN_TENANT_ID: 79f0cb1a-28e2-448a-858b-8d37bb32bd24
    steps:
      # Which tiers the pull request changes: main's merge base against the
      # head, from the API (names, and the names renamed files had). An
      # unmapped path under infrastructure/terraform/ fails the job, so a new
      # tier cannot go unplanned silently. A change to caersid's caller of
      # this workflow plans both tiers.
      - name: Find the changed tiers
        id: tiers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cmp=$(gh api "repos/$REPO/compare/$MAIN_SHA...$HEAD_SHA") || { echo "::error::the head could not be compared with main"; exit 1; }
          n=$(jq -er '.files | length' <<<"$cmp") || { echo "::error::the comparison has no file list"; exit 1; }
          [ "$n" -lt 300 ] || { echo "::error::the pull request changes more files than the API lists; nothing is planned"; exit 1; }
          jq -r '.files[] | .filename, (.previous_filename // empty)' <<<"$cmp" > "$RUNNER_TEMP/changed.txt"
          tf=infrastructure/terraform
          platform=false compute=false identity=false harness=false unmapped=
          while IFS= read -r path; do
            [ -n "$path" ] || continue
            case $path in
              "$tf/platform/"* | "$tf/environments/platform-production.tfvars") platform=true ;;
              "$tf/compute/"* | "$tf/environments/compute-production.tfvars") compute=true ;;
              "$tf/identity/"* | "$tf/environments/local.tfvars" | "$tf/environments/production.tfvars") identity=true ;;
              .github/workflows/terraform-plan.yml) harness=true ;;
              "$tf/scripts/"*) ;;
              "$tf/"*) unmapped="$unmapped x" ;;
              *) ;;
            esac
          done < "$RUNNER_TEMP/changed.txt"
          if [ -n "$unmapped" ]; then
            echo "::error title=Unmapped Terraform path::a path under $tf/ maps to no tier. Map it in Talieisin/.github's terraform-plan.yml."
            exit 1
          fi
          plan_platform=false plan_compute=false
          if [ "$platform" = true ] || [ "$harness" = true ]; then plan_platform=true; fi
          if [ "$compute" = true ] || [ "$harness" = true ]; then plan_compute=true; fi
          printf 'platform=%s\ncompute=%s\nidentity=%s\nharness=%s\nplan_platform=%s\nplan_compute=%s\n' \
            "$platform" "$compute" "$identity" "$harness" "$plan_platform" "$plan_compute" >> "$GITHUB_OUTPUT"

      # state: planned | not-needed | not-configured.
      - name: Decide whether to plan
        id: decide
        env:
          PLAN_PLATFORM: ${{ steps.tiers.outputs.plan_platform }}
          PLAN_COMPUTE: ${{ steps.tiers.outputs.plan_compute }}
          CLIENT_ID: ${{ inputs.azure-client-id }}
          TENANT_ID: ${{ inputs.azure-tenant-id }}
        run: |
          set -euo pipefail
          if [ "$PLAN_PLATFORM" != true ] && [ "$PLAN_COMPUTE" != true ]; then
            state=not-needed
          elif [ -z "$CLIENT_ID" ] || [ -z "$TENANT_ID" ]; then
            echo "::warning title=Nothing planned::azure-client-id or azure-tenant-id is not set in the caller."
            state=not-configured
          elif [ "$CLIENT_ID" != "$PLAN_CLIENT_ID" ] || [ "$TENANT_ID" != "$PLAN_TENANT_ID" ]; then
            # The caller (which a pull request can edit) may switch planning on
            # or off, never choose the identity.
            echo "::error title=Nothing planned::azure-client-id and azure-tenant-id must be id-caersid-plan-prod's ($PLAN_CLIENT_ID) and its tenant's ($PLAN_TENANT_ID)."
            exit 1
          else
            state=planned
          fi
          echo "state=$state" >> "$GITHUB_OUTPUT"

      - name: Fetch the head and main
        if: steps.decide.outputs.state == 'planned'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # By commit id: git verifies every object it receives against its id. The
          # token goes in through the environment, never an argument.
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth"
          repo="$RUNNER_TEMP/repo"
          git init -q "$repo"
          git -C "$repo" fetch -q --no-tags --depth=1 "https://github.com/$REPO" "$HEAD_SHA" "$MAIN_SHA"
          mkdir -p "$RUNNER_TEMP/head" "$RUNNER_TEMP/base"
          git -C "$repo" archive --format=tar "$HEAD_SHA" infrastructure/terraform | tar -x -C "$RUNNER_TEMP/head"
          git -C "$repo" archive --format=tar "$MAIN_SHA" infrastructure/terraform | tar -x -C "$RUNNER_TEMP/base"
          rm -rf "$repo"
          echo "ok: the head and main fetched"

      # Go from go.dev, checked against the SHA-256 recorded here; the HCL
      # modules are checked by go.sum. No cache.
      - name: Build tfguard
        if: steps.decide.outputs.state == 'planned'
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 3 --max-time 300 -o go.tgz https://go.dev/dl/go1.26.10.linux-amd64.tar.gz
          got=$(sha256sum go.tgz)
          [ "${got%% *}" = ccfe7ae822d2c2f41f4fe7c956199967a4dac22d0ee0d2b2bfdb440aab3b20c5 ] || { echo "::error::Go checksum mismatch"; exit 1; }
          tar -xzf go.tgz && rm go.tgz
          src="$RUNNER_TEMP/tfguard-src"
          mkdir -p "$src"
          cat > "$src/go.mod" <<'GOSRC'
          module tfguard

          go 1.25.0

          require github.com/hashicorp/hcl/v2 v2.25.0

          require (
          	github.com/agext/levenshtein v1.2.1 // indirect
          	github.com/apparentlymart/go-textseg/v15 v15.0.0 // indirect
          	github.com/apparentlymart/go-textseg/v17 v17.0.1 // indirect
          	github.com/mitchellh/go-wordwrap v1.0.1 // indirect
          	github.com/zclconf/go-cty v1.19.0 // indirect
          	golang.org/x/mod v0.29.0 // indirect
          	golang.org/x/sync v0.18.0 // indirect
          	golang.org/x/text v0.31.0 // indirect
          	golang.org/x/tools v0.38.0 // indirect
          )
          GOSRC
          cat > "$src/go.sum" <<'GOSRC'
          github.com/agext/levenshtein v1.2.1 h1:QmvMAjj2aEICytGiWzmxoE0x2KZvE0fvmqMOfy2tjT8=
          github.com/agext/levenshtein v1.2.1/go.mod h1:JEDfjyjHDjOF/1e4FlBE/PkbqA9OfWu2ki2W0IB5558=
          github.com/apparentlymart/go-textseg/v15 v15.0.0 h1:uYvfpb3DyLSCGWnctWKGj857c6ew1u1fNQOlOtuGxQY=
          github.com/apparentlymart/go-textseg/v15 v15.0.0/go.mod h1:K8XmNZdhEBkdlyDdvbmmsvpAG721bKi0joRfFdHIWJ4=
          github.com/apparentlymart/go-textseg/v17 v17.0.1 h1:bpMXRgQ5cEoRNuQke1a80/Nl6w3G5eoIbWo9f3gXkAs=
          github.com/apparentlymart/go-textseg/v17 v17.0.1/go.mod h1:fa8X4jgGeevslICIY6LcdjkSecWnXmYd9Lk34z/VxZs=
          github.com/davecgh/go-spew v1.1.1 h1:vj9j/u1bqnvCEfJOwUhtlOARqs3+rkHYY13jYWTU97c=
